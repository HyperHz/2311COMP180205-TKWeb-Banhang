<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý cửa hàng | GreenLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="admin.html">🌿 GreenLife Admin</a>
      <div class="d-flex">
        <button id="logoutBtn" class="btn btn-light btn-sm">Đăng xuất</button>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h3 class="text-success mb-4">Bảng điều khiển quản lý</h3>

    <div class="row g-4">
      <div class="col-md-3">
        <div class="admin-card text-center p-4" onclick="openPage('admin-customers.html')">
          <i class="fa-solid fa-users fa-2x text-success mb-2"></i>
          <h5>Khách hàng</h5>
          <p class="text-muted">Xem và quản lý danh sách người dùng.</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card text-center p-4" onclick="openPage('admin-products.html')">
          <i class="fa-solid fa-seedling fa-2x text-success mb-2"></i>
          <h5>Sản phẩm</h5>
          <p class="text-muted">Quản lý, thêm hoặc chỉnh sửa sản phẩm.</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card text-center p-4" onclick="openPage('admin-orders.html')">
          <i class="fa-solid fa-seedling fa-2x text-success mb-2"></i>
          <h5>Đơn hàng</h5>
          <p class="text-muted">Quản lý tất cả các đơn hàng của tiệm.</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card text-center p-4" onclick="openPage('admin-revenue.html')">
          <i class="fa-solid fa-chart-pie fa-2x text-success mb-2"></i>
          <h5>Doanh thu</h5>
          <p class="text-muted">Xem tổng doanh thu và thống kê bán hàng.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">© 2025 GreenLife 🌿</p>
  </footer>

  <script src="js/admin.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
