<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Thanh toán | GreenLife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">🌿 GreenLife</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Giỏ hàng</a></li>
            </ul>
        </div>
        </div>
    </nav>

    <!-- THANH TOÁN -->
    <main class="container my-5">
        <h3 class="text-success mb-4">Thanh toán đơn hàng</h3>

        <div class="row g-4">
        <!-- SẢN PHẨM -->
        <div class="col-lg-6">
            <div class="p-3 border rounded bg-white shadow-sm">
            <h5 class="mb-3">Sản phẩm đã chọn</h5>
            <div id="checkoutList"></div>
            </div>
        </div>

        <!-- THÔNG TIN GIAO HÀNG -->
        <div class="col-lg-6">
            <div class="p-3 border rounded bg-white shadow-sm">
            <h5 class="mb-3">Thông tin giao hàng</h5>

            <input id="name" type="text" class="form-control mb-2" placeholder="Họ và tên">
            <input id="phone" type="text" class="form-control mb-2" placeholder="Số điện thoại">
            <input id="address" type="text" class="form-control mb-2" placeholder="Địa chỉ giao hàng">
            <textarea id="note" rows="2" class="form-control mb-3" placeholder="Ghi chú (tuỳ chọn)"></textarea>

            <p class="fw-bold">Tổng tiền: <span id="totalPrice" class="text-success"></span></p>

            <button id="btnConfirm" class="btn btn-success w-100">Xác nhận đặt hàng</button>
            </div>
        </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-light text-center py-4 mt-5">
        <p class="mb-0">© 2025 GreenLife 🌿</p>
    </footer>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/guard.js"></script>

</body>
</html>
