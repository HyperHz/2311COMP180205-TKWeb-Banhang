<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doanh thu & Thống kê | GreenLife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/admin-revenue.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="admin.html">🌿 GreenLife Admin</a>
            <div class="d-flex">
                <button id="logoutBtn" class="btn btn-light btn-sm">Đăng xuất</button>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h3 class="text-success mb-4">Báo cáo doanh thu</h3>
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="revenue-box p-4 text-center">
                    <h6 class="text-muted">Tổng doanh thu</h6>
                    <h3 id="totalRevenue" class="text-success fw-bold">0₫</h3>
                </div>
            </div>
            <div class="col-12 col-md-8">
                <div class="chart-box p-3">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>
        <div class="mt-5">
            <h5 class="text-success mb-3">Danh sách sản phẩm bán ra</h5>
            <table class="table table-bordered table-hover align-middle text-center">
                <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Tên sản phẩm</th>
                    <th>Phân loại</th>
                    <th>Giá (₫)</th>
                    <th>Số lượng bán</th>
                    <th>Doanh thu (₫)</th>
                </tr>
                </thead>
                <tbody id="productTable"></tbody>
            </table>
        </div>
    </main>
    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2025 GreenLife 🌿</p>
    </footer>
    <script src="js/admin-revenue.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
