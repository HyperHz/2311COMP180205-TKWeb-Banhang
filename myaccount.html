<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tài khoản của tôi | GreenLife</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/myaccount.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="index.html">🌿 GreenLife</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Giỏ hàng</a></li>
          <li class="nav-item"><a class="nav-link" href="wishlist.html">Yêu thích</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Đơn hàng</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a id="accToggle" class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="fa-regular fa-user"></i> Tài khoản
            </a>
            <ul id="accMenu" class="dropdown-menu dropdown-menu-end"></ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container my-5">
    <h3 class="text-success mb-4">👤 Thông tin tài khoản</h3>

    <div class="account-box p-4 bg-white shadow-sm rounded">
      <form id="accountForm">
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input id="fullname" type="text" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input id="phone" type="text" class="form-control" disabled>
          <div class="form-text text-muted">Không thể thay đổi số điện thoại đăng ký</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="email" type="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Địa chỉ</label>
          <input id="address" type="text" class="form-control">
        </div>
        <button type="submit" class="btn btn-success px-4">💾 Lưu thay đổi</button>
      </form>
    </div>
  </main>

  <footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">© 2025 GreenLife 🌿</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/myaccount.js"></script>
  <script src="js/guard.js"></script>

</body>
</html>
