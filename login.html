<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tài khoản | GreenLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-box shadow-lg rounded-4 bg-white p-4 animate__animated animate__fadeIn">
      <h3 class="text-center mb-3 text-success fw-bold">🌿 GreenLife</h3>

      <!-- Tabs -->
      <ul class="nav nav-pills justify-content-center mb-3" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginTab">Đăng nhập</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerTab">Đăng ký</button>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <!-- LOGIN -->
        <div class="tab-pane fade show active" id="loginTab">
          <div class="form-animate">
            <input id="loginUser" type="text" class="form-control mb-3" placeholder="Số điện thoại hoặc Gmail">
            <input id="loginPass" type="password" class="form-control mb-3" placeholder="Mật khẩu">
            <button id="btnLogin" class="btn btn-success w-100 rounded-pill py-2">Đăng nhập</button>
          </div>
        </div>

        <!-- REGISTER -->
        <div class="tab-pane fade" id="registerTab">
          <div class="form-animate">
            <div class="row g-2">
              <div class="col-md-6">
                <input id="regName" type="text" class="form-control mb-2" placeholder="Họ và tên">
              </div>
              <div class="col-md-6">
                <input id="regPhone" type="text" class="form-control mb-2" placeholder="Số điện thoại">
              </div>
            </div>
            <input id="regEmail" type="email" class="form-control mb-2" placeholder="Email">
            <input id="regAddress" type="text" class="form-control mb-2" placeholder="Địa chỉ">
            <input id="regPass" type="password" class="form-control mb-3" placeholder="Tạo mật khẩu">
            <button id="btnRegister" class="btn btn-success w-100 rounded-pill py-2">Đăng ký</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Animation CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Hiệu ứng fade mượt khi chuyển tab
    const tabTriggers = document.querySelectorAll('[data-bs-toggle="pill"]');
    tabTriggers.forEach(btn => {
      btn.addEventListener('shown.bs.tab', e => {
        const target = document.querySelector(e.target.dataset.bsTarget);
        target.classList.add('animate__animated', 'animate__fadeIn');
        setTimeout(()=> target.classList.remove('animate__fadeIn'), 500);
      });
    });
  </script>
</body>
</html>
