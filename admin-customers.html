<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý khách hàng | GreenLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-customers.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
        <a class="navbar-brand fw-bold" href="admin.html">🌿 GreenLife Admin</a>
        <div class="d-flex">
            <button id="logoutBtn" class="btn btn-light btn-sm">Đăng xuất</button>
        </div>
        </div>
    </nav>

    <main class="container my-5">
        <h3 class="text-success mb-4">Danh sách khách hàng</h3>

        <!-- Thanh tìm kiếm -->
        <div class="input-group mb-4">
        <input id="searchInput" type="text" class="form-control" placeholder="Tìm theo tên hoặc số điện thoại...">
        <button id="searchBtn" class="btn btn-success"><i class="fa fa-search"></i></button>
        </div>

        <!-- Danh sách khách hàng -->
        <div id="customerList" class="row g-3"></div>

        <div id="noResult" class="text-center text-muted mt-3 d-none">Không tìm thấy khách hàng nào.</div>
    </main>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2025 GreenLife 🌿</p>
    </footer>

    <script src="js/admin-customers.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
