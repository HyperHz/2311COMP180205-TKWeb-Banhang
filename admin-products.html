<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý sản phẩm | GreenLife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-products.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
        <a class="navbar-brand fw-bold" href="admin.html">🌿 GreenLife Admin</a>
        <div class="d-flex">
            <button id="logoutBtn" class="btn btn-light btn-sm">Đăng xuất</button>
        </div>
        </div>
    </nav>

    <main class="container my-5">
        <h3 class="text-success mb-4">Quản lý sản phẩm</h3>

        <!-- Tìm kiếm + Thêm sản phẩm -->
        <div class="d-flex flex-wrap gap-2 mb-4">
        <div class="input-group" style="max-width:400px;">
            <input id="searchInput" type="text" class="form-control" placeholder="Tìm sản phẩm...">
            <button id="searchBtn" class="btn btn-success"><i class="fa fa-search"></i></button>
        </div>
        <button id="btnAdd" class="btn btn-outline-success ms-auto">
            <i class="fa fa-plus"></i> Thêm sản phẩm
        </button>
        </div>

        <!-- Danh sách sản phẩm -->
        <div id="productList" class="row g-3"></div>
        <div id="noResult" class="text-center text-muted mt-3 d-none">Không tìm thấy sản phẩm nào.</div>
    </main>

    <!-- Modal thêm / sửa sản phẩm -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
        <div class="modal-content p-3">
            <div class="modal-header border-0">
            <h5 id="modalTitle" class="modal-title text-success">Thêm sản phẩm</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
            <input id="productName" class="form-control mb-2" placeholder="Tên sản phẩm">
            <input id="productPrice" type="number" class="form-control mb-2" placeholder="Giá (VNĐ)">
            <input id="productImg" class="form-control mb-2" placeholder="Link hình ảnh">
            <select id="productCategory" class="form-select mb-2">
                <option value="">Chọn loại cây</option>
                <option>Chậu cây cảnh</option>
                <option>Cây để bàn</option>
                <option>Cây thủy sinh</option>
            </select>
            <textarea id="productDesc" rows="3" class="form-control mb-2" placeholder="Mô tả sản phẩm..."></textarea>
            </div>
            <div class="modal-footer border-0">
            <button class="btn btn-success" id="saveProductBtn">Lưu</button>
            </div>
        </div>
        </div>
    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2025 GreenLife 🌿</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-products.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
