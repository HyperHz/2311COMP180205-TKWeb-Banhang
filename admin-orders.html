<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng | GreenLife Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a href="admin.html" class="navbar-brand fw-bold">🌿 GreenLife Admin</a>
                <div class="d-flex">
                    <button id="logoutBtn" class="btn btn-light btn-sm">Đăng xuất</button>
                </div>
            </div>
        </nav>
        <main class="main-content p-4">
            <h3 class="mb-4 text-success">Quản lý đơn hàng</h3>
            <div class="table-responsive shadow-sm bg-white p-3 rounded">
                <table class="table align-middle">
                <thead class="table-success">
                    <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Ngày đặt</th>
                    <th>Số SP</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                    </tr>
                </thead>
                <tbody id="orderTable"></tbody>
                </table>
            </div>
        </main>
    </div>
    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2025 GreenLife 🌿</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-orders.js"></script>
</body>
</html>
